services:
  atlas-postgres:
    image: postgres:16-alpine
    container_name: atlas-invest-db
    env_file:
      - .env
    environment:
      # Explicitly set to postgres to override system env vars
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atlas_db

    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas-invest-network

  atlas-invest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-invest
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: atlas-postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: atlas_db
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/atlas_db
    ports:
      - 3000:3000
    depends_on:
      atlas-postgres:
        condition: service_healthy
    networks:
      - atlas-invest-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  atlas-invest-network:
    driver: bridge
